<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>A redirecionar… | THISGEN</title>
<script>
(function () {
  var WIX = 'https://healthdeducation.wixsite.com/treinamento-crossfit';
  var p = decodeURIComponent(location.pathname).toLowerCase().replace(/\/+$/, '');
  var map = {
    '/aulas': '/#modalidades', '/treinar-na-thisgen': '/#modalidades', '/kick-fight': '/#modalidades',
    '/horário': '/#visita', '/horario': '/#visita',
    '/avaliação-experimental': '/#metodo', '/service-page/avaliação-coaching': '/#metodo',
    '/pricing-plans/planos': '/#precos', '/service-page/aula-experimental-1': '/#precos',
    '/convite': '/convite', '/referral': '/convite'
  };
  // Páginas encerradas: Mente Primeiro, Thisgen 90, Black Week, grupos, envio de fotos
  var fechadas = /^\/(mente-primeiro|quiz-mente-primeiro|menteprimeiro-anamnese|calculadora-?mente-?primeiro|calculadoramenteprimeiro|black-week|groups|group\/|envio-fotos-video|whatsapp-eventos|event-details\/thisgen-90|gift-card)/;
  // Eventos continuam na Wix até ao fim dos eventos já à venda
  var wix = /^\/(eventos|event-details\/|product-page\/|category\/)/;
  var dest = map[p] || (/^\/service-page\//.test(p) ? '/#modalidades' : fechadas.test(p) ? '/' : wix.test(p) ? WIX + location.pathname + location.search : '/');
  location.replace(dest);
})();
</script>
